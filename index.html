<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practice Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EDF1F5;
    --surface: #FFFFFF;
    --ink: #202B3A;
    --ink-soft: #626E7F;
    --ink-faint: #9AA5B3;
    --border: #DCE3EB;
    --border-soft: #E9EEF3;
    --german: #3B6E8F;
    --german-soft: #DCE9F0;
    --russian: #B5504B;
    --russian-soft: #F3DEDC;
    --exercise: #4C8C6B;
    --exercise-soft: #DCEDE3;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(32,43,58,0.04), 0 8px 24px rgba(32,43,58,0.06);
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .app{
    max-width: 860px;
    margin: 0 auto;
    padding: 36px 20px 60px;
  }

  /* Header */
  header{
    display:flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 28px;
    gap: 16px;
    flex-wrap: wrap;
  }
  .title-block h1{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 34px;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .title-block p{
    margin:0;
    color: var(--ink-soft);
    font-size: 14px;
  }

  /* Streak row */
  .streaks{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 28px;
  }
  .streak-card{
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 16px 18px;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }
  .streak-card::before{
    content:'';
    position:absolute;
    left:0; top:0; bottom:0;
    width: 4px;
  }
  .streak-card.german::before{ background: var(--german); }
  .streak-card.russian::before{ background: var(--russian); }
  .streak-card.exercise::before{ background: var(--exercise); }
  .streak-label{
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    font-weight: 600;
    margin-bottom: 6px;
  }
  .streak-value{
    font-family: 'JetBrains Mono', monospace;
    font-size: 26px;
    font-weight: 500;
    display:flex;
    align-items: baseline;
    gap: 6px;
  }
  .streak-value span{
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: var(--ink-faint);
    font-weight: 500;
  }

  /* Month nav */
  .month-nav{
    display:flex;
    align-items:center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .month-nav h2{
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 20px;
    margin:0;
  }
  .nav-buttons{ display:flex; gap: 6px; }
  .nav-buttons button{
    width: 34px; height: 34px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    font-size: 16px;
    cursor: pointer;
    display:flex; align-items:center; justify-content:center;
    transition: background .15s ease, border-color .15s ease;
  }
  .nav-buttons button:hover{ background: var(--border-soft); }
  .nav-buttons button:focus-visible{ outline: 2px solid var(--german); outline-offset: 2px; }
  .today-btn{
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 0 12px;
    cursor: pointer;
    margin-right: 6px;
  }
  .today-btn:hover{ background: var(--border-soft); }

  /* Calendar */
  .calendar{
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px;
  }
  .weekdays{
    display:grid;
    grid-template-columns: repeat(7, 1fr);
    margin-bottom: 6px;
  }
  .weekdays div{
    text-align:center;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-faint);
    padding-bottom: 8px;
  }
  .days{
    display:grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }
  .day{
    aspect-ratio: 1 / 1;
    border-radius: 10px;
    border: 1px solid transparent;
    background: var(--bg);
    display:flex;
    flex-direction: column;
    align-items:center;
    justify-content:center;
    gap: 5px;
    cursor: pointer;
    position: relative;
    transition: background .15s ease, transform .1s ease;
    padding: 4px;
  }
  .day:hover{ background: var(--border-soft); }
  .day:focus-visible{ outline: 2px solid var(--german); outline-offset: 1px; }
  .day.empty{ background: transparent; cursor: default; pointer-events: none; }
  .day.future{ opacity: 0.4; cursor: default; }
  .day .num{
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
  }
  .day.today{
    background: var(--surface);
    border-color: var(--ink);
  }
  .day.today .num{ color: var(--ink); font-weight: 600; }
  .dots{ display:flex; gap: 3px; }
  .dot{
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--border);
  }
  .dot.german.on{ background: var(--german); }
  .dot.russian.on{ background: var(--russian); }
  .dot.exercise.on{ background: var(--exercise); }

  .legend{
    display:flex;
    gap: 18px;
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--border-soft);
    font-size: 12px;
    color: var(--ink-soft);
    flex-wrap: wrap;
  }
  .legend-item{ display:flex; align-items:center; gap:6px; }
  .legend-item .dot{ width:7px; height:7px; }

  /* Panel */
  .overlay{
    position: fixed; inset:0;
    background: rgba(32,43,58,0.32);
    display:none;
    align-items:center;
    justify-content:center;
    padding: 20px;
    z-index: 50;
  }
  .overlay.open{ display:flex; }
  .panel{
    background: var(--surface);
    border-radius: 18px;
    width: 100%;
    max-width: 420px;
    max-height: 88vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(32,43,58,0.25);
    padding: 24px;
  }
  .panel-header{
    display:flex;
    align-items:center;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  .panel-header h3{
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 20px;
    margin: 0;
  }
  .close-btn{
    width: 28px; height: 28px;
    border-radius: 8px;
    border: none;
    background: var(--bg);
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 15px;
    display:flex; align-items:center; justify-content:center;
  }
  .close-btn:hover{ background: var(--border-soft); }

  .habit-row{
    border: 1px solid var(--border-soft);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 10px;
    transition: border-color .15s ease, background .15s ease;
  }
  .habit-row.active.german{ border-color: var(--german); background: var(--german-soft); }
  .habit-row.active.russian{ border-color: var(--russian); background: var(--russian-soft); }
  .habit-row.active.exercise{ border-color: var(--exercise); background: var(--exercise-soft); }

  .habit-top{
    display:flex;
    align-items:center;
    gap: 10px;
    cursor: pointer;
    user-select: none;
  }
  .checkbox{
    width: 20px; height: 20px;
    border-radius: 6px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
    display:flex; align-items:center; justify-content:center;
    transition: background .15s ease, border-color .15s ease;
  }
  .checkbox svg{ display:none; width:12px; height:12px; }
  .habit-row.active .checkbox svg{ display:block; }
  .habit-row.active.german .checkbox{ background: var(--german); border-color: var(--german); }
  .habit-row.active.russian .checkbox{ background: var(--russian); border-color: var(--russian); }
  .habit-row.active.exercise .checkbox{ background: var(--exercise); border-color: var(--exercise); }
  .habit-name{ font-weight: 600; font-size: 14.5px; }

  .habit-input-wrap{
    margin-top: 10px;
    max-height: 0;
    overflow: hidden;
    transition: max-height .18s ease;
  }
  .habit-row.active .habit-input-wrap{ max-height: 60px; }
  .habit-input{
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 11px;
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    background: var(--surface);
    color: var(--ink);
  }
  .habit-input:focus{ outline: none; border-color: var(--ink-faint); }
  .habit-input::placeholder{ color: var(--ink-faint); }

  .panel-footer{
    display:flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 18px;
  }
  .btn{
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    font-weight: 600;
    padding: 9px 16px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
  }
  .btn:hover{ background: var(--border-soft); }
  .btn.primary{
    background: var(--ink);
    color: var(--surface);
    border-color: var(--ink);
  }
  .btn.primary:hover{ opacity: 0.88; }

  .save-hint{
    font-size: 11px;
    color: var(--ink-faint);
    text-align: center;
    margin-top: 10px;
    min-height: 14px;
  }

  @media (max-width: 480px){
    .streaks{ grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .streak-card{ padding: 12px; }
    .streak-value{ font-size: 20px; }
    .day .num{ font-size: 10px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title-block">
      <h1>Practice Log</h1>
      <p>German · Russian · Movement — shared with your partner</p>
    </div>
  </header>
  <div id="load-status" style="display:none; font-size:13px; color: var(--ink-soft); margin: -18px 0 20px;">Loading your log…</div>

  <div class="streaks">
    <div class="streak-card german">
      <div class="streak-label">German</div>
      <div class="streak-value" id="streak-german">0<span>day streak</span></div>
    </div>
    <div class="streak-card russian">
      <div class="streak-label">Russian</div>
      <div class="streak-value" id="streak-russian">0<span>day streak</span></div>
    </div>
    <div class="streak-card exercise">
      <div class="streak-label">Exercise</div>
      <div class="streak-value" id="streak-exercise">0<span>day streak</span></div>
    </div>
  </div>

  <div class="month-nav">
    <h2 id="month-label">August 2026</h2>
    <div class="nav-buttons">
      <button class="today-btn" id="today-btn">Today</button>
      <button id="prev-btn" aria-label="Previous month">‹</button>
      <button id="next-btn" aria-label="Next month">›</button>
    </div>
  </div>

  <div class="calendar">
    <div class="weekdays">
      <div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div>
    </div>
    <div class="days" id="days-grid"></div>
    <div class="legend">
      <div class="legend-item"><span class="dot german on"></span> German</div>
      <div class="legend-item"><span class="dot russian on"></span> Russian</div>
      <div class="legend-item"><span class="dot exercise on"></span> Exercise</div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="panel">
    <div class="panel-header">
      <h3 id="panel-date">—</h3>
      <button class="close-btn" id="close-btn">✕</button>
    </div>

    <div class="habit-row german" id="row-german" data-habit="german">
      <div class="habit-top" id="toggle-german">
        <div class="checkbox"><svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.5 12L13 4.5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div class="habit-name">Studied German</div>
      </div>
      <div class="habit-input-wrap">
        <input class="habit-input" id="input-german" type="text" placeholder="Live speaking, flashcards, reading..." maxlength="120">
      </div>
    </div>

    <div class="habit-row russian" id="row-russian" data-habit="russian">
      <div class="habit-top" id="toggle-russian">
        <div class="checkbox"><svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.5 12L13 4.5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div class="habit-name">Studied Russian</div>
      </div>
      <div class="habit-input-wrap">
        <input class="habit-input" id="input-russian" type="text" placeholder="Live speaking, flashcards, reading..." maxlength="120">
      </div>
    </div>

    <div class="habit-row exercise" id="row-exercise" data-habit="exercise">
      <div class="habit-top" id="toggle-exercise">
        <div class="checkbox"><svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.5 12L13 4.5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div class="habit-name">Exercised</div>
      </div>
      <div class="habit-input-wrap">
        <input class="habit-input" id="input-exercise" type="text" placeholder="Run, lift, yoga, walk..." maxlength="120">
      </div>
    </div>

    <div class="panel-footer">
      <button class="btn" id="cancel-btn">Cancel</button>
      <button class="btn primary" id="save-btn">Save</button>
    </div>
    <div class="save-hint" id="save-hint"></div>
  </div>
</div>

<script>
(function(){
  const HABITS = ['german','russian','exercise'];
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw7H-sCkFZwr-Pfa-1nWqS8PVV8DI9TFl1ZXkXxMHHVgXILDjcBkE5TvmPvagbYslh5HQ/exec';
  let entries = {};
  let current = new Date();
  current.setDate(1);
  const today = new Date();
  const todayStr = fmt(today);
  let selectedDate = null;
  let draft = null;

  function fmt(d){
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }

  async function loadEntries(){
    const status = document.getElementById('load-status');
    status.style.display = 'block';
    try{
      const res = await fetch(SCRIPT_URL, { method: 'GET' });
      entries = await res.json();
      status.style.display = 'none';
    }catch(e){
      console.error('Load failed', e);
      entries = {};
      status.textContent = "Couldn't load from the shared sheet. Showing an empty log — try refreshing.";
    }
    render();
  }

  async function saveEntry(dateStr, entry){
    entries[dateStr] = entry;
    // text/plain avoids a CORS preflight, which Apps Script web apps don't handle.
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ date: dateStr, entry: entry })
    });
    if(!res.ok) throw new Error('Server responded with ' + res.status);
  }

  function monthLabel(d){
    return d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  }

  function buildDays(d){
    const year = d.getFullYear();
    const month = d.getMonth();
    const firstDay = new Date(year, month, 1);
    // Monday-first index
    let startWeekday = firstDay.getDay() - 1;
    if(startWeekday < 0) startWeekday = 6;
    const daysInMonth = new Date(year, month+1, 0).getDate();

    const grid = document.getElementById('days-grid');
    grid.innerHTML = '';

    for(let i=0;i<startWeekday;i++){
      const el = document.createElement('div');
      el.className = 'day empty';
      grid.appendChild(el);
    }

    for(let day=1; day<=daysInMonth; day++){
      const dateObj = new Date(year, month, day);
      const dateStr = fmt(dateObj);
      const el = document.createElement('div');
      el.className = 'day';
      if(dateStr === todayStr) el.className += ' today';
      if(dateObj > today) el.className += ' future';

      const num = document.createElement('div');
      num.className = 'num';
      num.textContent = day;
      el.appendChild(num);

      const dots = document.createElement('div');
      dots.className = 'dots';
      const entry = entries[dateStr];
      HABITS.forEach(h => {
        const dot = document.createElement('div');
        dot.className = 'dot ' + h + (entry && entry[h] && entry[h].done ? ' on' : '');
        dots.appendChild(dot);
      });
      el.appendChild(dots);

      if(dateObj <= today){
        el.addEventListener('click', () => openPanel(dateStr));
        el.tabIndex = 0;
        el.addEventListener('keydown', e => { if(e.key==='Enter') openPanel(dateStr); });
      }

      grid.appendChild(el);
    }
  }

  function computeStreak(habit){
    let streak = 0;
    let cursor = new Date(today);
    // if today not done yet, start counting from yesterday (don't break streak just because today's not logged yet)
    const todayEntry = entries[fmt(cursor)];
    if(!todayEntry || !todayEntry[habit] || !todayEntry[habit].done){
      cursor.setDate(cursor.getDate()-1);
    }
    while(true){
      const key = fmt(cursor);
      const e = entries[key];
      if(e && e[habit] && e[habit].done){
        streak++;
        cursor.setDate(cursor.getDate()-1);
      } else {
        break;
      }
    }
    return streak;
  }

  function renderStreaks(){
    HABITS.forEach(h => {
      document.getElementById('streak-'+h).firstChild.textContent = computeStreak(h);
    });
  }

  function render(){
    document.getElementById('month-label').textContent = monthLabel(current);
    buildDays(current);
    renderStreaks();
  }

  function openPanel(dateStr){
    selectedDate = dateStr;
    draft = JSON.parse(JSON.stringify(entries[dateStr] || {}));
    HABITS.forEach(h => { if(!draft[h]) draft[h] = { done:false, activity:'' }; });

    const d = new Date(dateStr + 'T00:00:00');
    document.getElementById('panel-date').textContent = d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });

    HABITS.forEach(h => {
      const row = document.getElementById('row-'+h);
      const input = document.getElementById('input-'+h);
      row.classList.toggle('active', !!draft[h].done);
      input.value = draft[h].activity || '';
    });

    document.getElementById('save-hint').textContent = '';
    document.getElementById('overlay').classList.add('open');
  }

  function closePanel(){
    document.getElementById('overlay').classList.remove('open');
    selectedDate = null;
    draft = null;
  }

  HABITS.forEach(h => {
    document.getElementById('toggle-'+h).addEventListener('click', () => {
      draft[h].done = !draft[h].done;
      document.getElementById('row-'+h).classList.toggle('active', draft[h].done);
      if(draft[h].done){
        setTimeout(()=> document.getElementById('input-'+h).focus(), 50);
      }
    });
    document.getElementById('input-'+h).addEventListener('input', (e) => {
      draft[h].activity = e.target.value;
    });
  });

  document.getElementById('save-btn').addEventListener('click', async () => {
    const cleaned = {};
    HABITS.forEach(h => {
      cleaned[h] = { done: !!draft[h].done, activity: (draft[h].activity||'').trim() };
    });

    const hint = document.getElementById('save-hint');
    hint.textContent = 'Saving...';
    const saveBtn = document.getElementById('save-btn');
    saveBtn.disabled = true;

    try{
      await saveEntry(selectedDate, cleaned);
      entries[selectedDate] = cleaned;
      render();
      closePanel();
    }catch(e){
      console.error('Save failed', e);
      hint.textContent = "Couldn't save — check your connection and try again.";
      saveBtn.disabled = false;
      return;
    }
    saveBtn.disabled = false;
  });

  document.getElementById('cancel-btn').addEventListener('click', closePanel);
  document.getElementById('close-btn').addEventListener('click', closePanel);
  document.getElementById('overlay').addEventListener('click', (e) => {
    if(e.target.id === 'overlay') closePanel();
  });
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape' && document.getElementById('overlay').classList.contains('open')) closePanel();
  });

  document.getElementById('prev-btn').addEventListener('click', () => {
    current.setMonth(current.getMonth()-1);
    render();
  });
  document.getElementById('next-btn').addEventListener('click', () => {
    current.setMonth(current.getMonth()+1);
    render();
  });
  document.getElementById('today-btn').addEventListener('click', () => {
    current = new Date();
    current.setDate(1);
    render();
  });

  loadEntries();
})();
</script>
</body>
</html>
